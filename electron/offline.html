<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>오프라인 상태입니다</title>
    <style>
      body {
        margin: 0;
        background-color: #1a1a1a;
        color: #fff;
        font-family: 'Segoe UI', sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        text-align: center;
      }

      h1 {
        font-size: 2.5rem;
        margin-bottom: 1rem;
      }

      p {
        font-size: 1.25rem;
        color: #ccc;
      }

      .retry-btn {
        margin-top: 2rem;
        padding: 0.75rem 2rem;
        font-size: 1rem;
        background-color: #1976d2;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }

      .retry-btn:hover {
        background-color: #1565c0;
      }
    </style>
  </head>
  <body>
    <h1>네트워크 연결이 불안정합니다</h1>
    <p>잠시 후 자동으로 다시 시도됩니다.<br />지속적으로 문제가 발생하면 관리자에게 문의해주세요.</p>
    <button class="retry-btn" onclick="retry()">지금 다시 시도</button>

    <script>
      function retry() {
        if (window.electronAPI?.retryReactApp) {
          window.electronAPI.retryReactApp();
        } else {
          console.warn('electronAPI.retryReactApp is not available');
        }
      }

      setTimeout(retry, 10000);
    </script>
  </body>
</html>
