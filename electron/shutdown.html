<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>시스템 종료 안내</title>
    <style>
      body {
        font-family: sans-serif;
        text-align: center;
        background-color: #222;
        color: #fff;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      h2 {
        font-size: 24px;
        margin-bottom: 10px;
      }

      #countdown {
        font-size: 64px;
        font-weight: bold;
        margin: 20px 0;
        color: #ff5252;
      }

      .buttons {
        margin-top: 20px;
      }

      button {
        font-size: 18px;
        padding: 10px 20px;
        margin: 0 10px;
        cursor: pointer;
        border: none;
        border-radius: 5px;
      }

      #yes {
        background-color: #f44336;
        color: white;
      }

      #no {
        background-color: #4caf50;
        color: white;
      }
    </style>
  </head>
  <body>
    <h2>운영 시간이 종료되었습니다</h2>
    <p>시스템이 곧 종료됩니다.</p>
    <div id="countdown">10</div>
    <div class="buttons">
      <button id="yes">예 (지금 종료)</button>
      <button id="no">아니오 (취소)</button>
    </div>

    <script>
      const { ipcRenderer } = require('electron');

      let seconds = 10;
      const countdownEl = document.getElementById('countdown');

      const interval = setInterval(() => {
        seconds--;
        countdownEl.textContent = seconds;
        if (seconds <= 0) clearInterval(interval);
      }, 1000);

      document.getElementById('yes').onclick = () => {
        window.close();
      };

      document.getElementById('no').onclick = () => {
        ipcRenderer.send('cancel-shutdown');
        clearInterval(interval);
        window.close();
      };
    </script>
  </body>
</html>
